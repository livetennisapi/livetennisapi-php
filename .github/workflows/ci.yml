name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      # Pin quota numbers and canonical URLs to product truth
      - run: sh scripts/truthcheck.sh
      - run: composer install --no-interaction --no-progress
      # Runs entirely offline against recorded fixtures (see README)
      - run: vendor/bin/phpunit
